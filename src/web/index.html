<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đảo Đèn Lồng</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    { "imports": { "three": "../../node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" hidden>
    <div class="corner tl"><div id="flames"></div><div class="small" id="nightname"></div></div>
    <div class="corner tc"><div id="time">5:00</div></div>
    <div class="corner tr"><div id="lit">0/5</div><div id="score">0</div></div>
    <div class="corner bc"><div id="carried"></div></div>
    <div class="corner br">
      <div class="cd" id="cd-dash"><span class="key">Shift</span><span class="ico">»</span><i></i></div>
      <div class="cd" id="cd-pulse"><span class="key">F</span><span class="ico">✺</span><i></i></div>
    </div>
    <div id="charm" hidden>Bùa Gió <b id="charm-s"></b></div>
    <div id="arrow" hidden>➤</div>
    <div id="shadearrow" hidden aria-hidden="true">➤</div>
    <div id="countdown" hidden aria-live="assertive"></div>
    <div id="subs" aria-live="polite"></div>
    <div id="prompt" hidden></div>
    <div id="toast" hidden></div>
    <div id="windwarn" hidden>🍃 Gió sắp thổi!</div>
    <div id="hitflash"></div>
  </div>

  <div id="overlay">
    <div class="card" id="card">
      <h1 id="ov-title">Đảo Đèn Lồng</h1>
      <p id="ov-sub">Ba Đêm — ba hòn đảo</p>
      <div id="ov-body"></div>
      <div id="ov-btns"></div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
